# Every 30 min from noon ET: projections for today's slate -> Telegram.
# Final lock = 1 hour before tip. GitHub cron runs can start late or be skipped, so a run
# that starts within 80 min of a lock waits in-job (scripts/wait_for_lock.py) and runs again
# right at the lock time (up to 3 locks per job).
# Cron is UTC: 16:00-03:00 UTC covers noon ET to 11 pm ET (EDT; one hour later in EST).
name: live-projections
on:
  schedule:
    - cron: "5,35 16-23 * * *"
    - cron: "5,35 0-3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Game date YYYY-MM-DD (default: today ET)"
        required: false
permissions:
  contents: write
concurrency:
  group: live-projections
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data + models
        uses: actions/cache/restore@v4
        with:
          key: nba-data-v1-none
          restore-keys: nba-data-v1-
          fail-on-cache-miss: true
          path: |
            data/processed
            data/models
            data/raw/bulk/shotdetail_*
            data/raw/bulk/matchups_2025
            data/raw/bbref
      - name: Restore this season's ESPN box-score cache
        uses: actions/cache/restore@v4
        with:
          key: espn-live-none
          restore-keys: espn-live-
          path: data/raw/espn/2026
      - name: Set date (input, else today in US Eastern)
        run: |
          D="${{ github.event.inputs.date }}"
          [ -n "$D" ] || D="$(TZ=America/New_York date +%F)"
          echo "D=$D" >> "$GITHUB_ENV"
      - name: Configure git
        run: |
          git config user.name "nba-projections-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Grade finished games (record + ROI @ -120)
        continue-on-error: true
        run: python -u scripts/grade.py
      - name: Projections + Telegram + push (again at each lock time within 80 min)
        id: live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ok=1
          cycle() {
            python -u scripts/live.py "$D" || ok=0
            python -u scripts/telegram_notify.py "$D" || echo "telegram failed"
            git add reports/live
            git diff --cached --quiet || git commit -q -m "Live projections $D"
            for i in 1 2 3 4; do
              # on conflicts keep THIS run's files (newest data); never leave a half-finished rebase behind
              if git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}"; then
                git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              else
                git rebase --abort 2>/dev/null || true
              fi
              sleep $((2 ** i))
            done
          }
          cycle
          for n in 1 2 3; do
            python -u scripts/wait_for_lock.py "$D" --within 80 || break
            cycle
          done
          [ "$ok" = 1 ] || echo "LIVE_FAILED=1" >> "$GITHUB_ENV"
      - name: Save ESPN cache
        uses: actions/cache/save@v4
        with:
          key: espn-live-${{ github.run_id }}
          path: data/raw/espn/2026
      - name: Note if live.py failed or no games today (check log)
        if: env.LIVE_FAILED == '1'
        run: echo "live.py failed or no games today (check log)"
